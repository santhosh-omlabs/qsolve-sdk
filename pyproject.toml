[project]
name = "qsolve-sdk"
version = "1.1.0"
description = "SDK for building reusable quantum and hybrid workflows on the Qsolve platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Santhosh Reddy", email = "santhosh@omlabs.co" }]
requires-python = ">=3.12"
keywords = ["quantum", "qiskit", "workflow", "quantum-computing", "benchmark", "error-mitigation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "threadpoolctl>=3.5",
    "jsonschema>=4.22",
    "typer>=0.12",
    "rich>=13.7",
    "qiskit>=2.0,<3",   # 2.x is what the platform runs; a 3.0 needs a deliberate upgrade
    "qiskit-aer>=0.17",
]

[project.urls]
Homepage = "https://qsolve.omlabs.co"
Documentation = "https://qsolve.omlabs.co/docs/build/overview"
Repository = "https://github.com/santhosh-omlabs/qsolve-sdk"
Issues = "https://github.com/santhosh-omlabs/qsolve-sdk/issues"
Changelog = "https://github.com/santhosh-omlabs/qsolve-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "types-jsonschema"]

[project.scripts]
qsolve = "qsolve.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/docs/design", "/.github", "/uv.lock", "/benchmarks"]

[tool.hatch.build.targets.wheel]
packages = ["src/qsolve"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "C4", "PIE"]
# InvalidSolution and QuantumNotAllowed are public names workflows already import
ignore = ["N818"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["threadpoolctl.*", "qiskit.*", "qiskit_aer.*", "qiskit_ibm_runtime.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# raised inside SciPy by qiskit's matrix exponential, not by this package
filterwarnings = ["ignore::scipy.sparse.SparseEfficiencyWarning"]
